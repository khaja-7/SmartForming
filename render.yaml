services:
  - type: web
    name: smart-agriculture-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn ai_api.api:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: GEMINI_API_KEY
        sync: false
